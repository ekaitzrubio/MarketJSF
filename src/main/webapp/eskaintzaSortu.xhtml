<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:p="primefaces"
	xmlns:ui="jakarta.faces.facelets">

<h:head>
	<title>Sortu Eskaintza</title>
	<h:outputStylesheet library="css" name="style.css" />
</h:head>

<h:body>
	<div class="page-container">
		<h3>Sortu</h3>

		<h:form enctype="multipart/form-data">
			<h:messages />

			<p class="form-group">
				<h:outputLabel for="izena" value="Tituloa" />
				<h:inputText id="izena" value="#{eskaintza.izena}" required="true"
					requiredMessage="Izena: Eremu hau derrigorrezkoa da" />
			</p>

			<p class="form-group">
				<h:outputLabel for="deskribapena" value="Deskribapena" />
				<h:inputText id="deskribapena" value="#{eskaintza.deskribapena}"
					required="true"
					requiredMessage="Deskribapena: Eremu hau derrigorrezkoa da" />
			</p>

			<p class="form-group">
				<h:outputLabel for="prezioa" value="Prezioa" />
				<h:inputText id="prezioa" value="#{eskaintza.prezioa}"
					required="true" />
			</p>

			<p class="form-group">
				<h:outputLabel for="egoera" value="Egoera" />
				<h:selectOneMenu id="egoera" value="#{eskaintza.egoera}">
					<f:selectItem itemValue="1" itemLabel="Berria" />
					<f:selectItem itemValue="2" itemLabel="Erabilita" />
					<f:selectItem itemValue="3" itemLabel="Oso erabilita" />
				</h:selectOneMenu>
			</p>

			<p class="form-group">
				<h:outputLabel for="email" value="Email" />
				<h:inputText id="email" value="#{eskaintza.email}" required="true"
					requiredMessage="Email: Eremu hau derrigorrezkoa da" />
			</p>

			<p class="form-group">
				<h:outputLabel for="data" value="Data" />
				<h:inputText id="data" value="#{eskaintza.data}" required="true"
					requiredMessage="Data: Eremu hau derrigorrezkoa da">
					<f:passThroughAttribute name="type" value="date" />
				</h:inputText>
			</p>

			<p class="form-group">
				<h:outputLabel for="argazkia" value="Argazkia" />
				<input id="argazkia" type="file" name="argazkia" accept="image/*" />
			</p>

			<h:commandButton value="Gorde" action="#{eskaintza.sortuEskaintza}" />
		</h:form>
	</div>
</h:body>
</html>
